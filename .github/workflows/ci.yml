name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Compile all Java sources with plain javac
        run: |
          mkdir -p /tmp/java-build-beginner /tmp/java-build-examples
          # Two independent programs share class names (Calculator,
          # CalculatorException) by design: the hand-written beginner version
          # and the Gradle-structured examples version. Compile separately.
          find 1_Beginner -name "*.java" -print0 | xargs -0 javac -d /tmp/java-build-beginner
          find examples -name "*.java" -print0 | xargs -0 javac -d /tmp/java-build-examples
          echo "Beginner sources: $(find 1_Beginner -name '*.java' | wc -l), examples sources: $(find examples -name '*.java' | wc -l)."

  notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate notebooks with nbformat
        run: |
          pip install nbformat
          python - <<'EOF'
          import glob, sys
          import nbformat
          bad = 0
          files = sorted(glob.glob("**/*.ipynb", recursive=True))
          for f in files:
              try:
                  nbformat.validate(nbformat.read(f, as_version=4))
              except Exception as e:
                  print(f"INVALID {f}: {e}")
                  bad += 1
          print(f"checked {len(files)} notebooks, {bad} invalid")
          sys.exit(1 if bad else 0)
          EOF

